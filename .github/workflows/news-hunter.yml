
name: AI Viral Director - News Hunter


on:
  schedule:
    # Collect news every 2 hours (UTC)
    - cron: "17 */2 * * *"

    # Telegram push: 09:27, 14:27, 19:27 SGT
    - cron: "27 1,6,11 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-viral-news-hunter
  cancel-in-progress: false

jobs:
  collect-and-push:
    name: Collect News and Push Telegram
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      # STEP 1: Prepare Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # STEP 2: Collect RSS news
      - name: Collect Latest News
        env:
          NEWS_COLLECT_SECRET: ${{ secrets.NEWS_COLLECT_SECRET }}

        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.NEWS_COLLECT_SECRET;

          if (!secret) {
            throw new Error("Missing NEWS_COLLECT_SECRET");
          }

          console.log("Starting News Hunter collection");

          const response = await fetch(
            "https://aiviral1.vercel.app/api/news/collect",
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${secret}`,
                Accept: "application/json"
              },
              signal: AbortSignal.timeout(90000)
            }
          );

          const body = await response.text();
          let result;

          try {
            result = JSON.parse(body);
          } catch {
            throw new Error(
              `Invalid collection response: HTTP ${response.status}`
            );
          }

          console.log("Scanned:", result.scanned ?? 0);
          console.log("Newly saved:", result.saved ?? 0);

          if (!response.ok || result.ok !== true) {
            console.error("Collection errors:", result.errors ?? []);
            throw new Error(
              `News Hunter failed: HTTP ${response.status}`
            );
          }

          console.log("News collection successful");
          NODE

      # STEP 3: Push pending news to Telegram
     
      - name: Push News to Telegram
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '27 1,6,11 * * *' }}
        env:
          NEWS_COLLECT_SECRET: ${{ secrets.NEWS_COLLECT_SECRET }}


        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.NEWS_COLLECT_SECRET;

          if (!secret) {
            throw new Error("Missing NEWS_COLLECT_SECRET");
          }

          console.log("Starting Telegram News Push");

          const response = await fetch(
            "https://aiviral1.vercel.app/api/news/push",
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${secret}`,
                Accept: "application/json"
              },
              signal: AbortSignal.timeout(90000)
            }
          );

          const body = await response.text();
          let result;

          try {
            result = JSON.parse(body);
          } catch {
            throw new Error(
              `Invalid Telegram push response: HTTP ${response.status}`
            );
          }

          console.log("Articles sent:", result.sentArticles ?? 0);
          console.log("Messages sent:", result.sentMessages ?? 0);

          if (!response.ok || result.ok !== true) {
            console.error("Push errors:", result.errors ?? []);
            throw new Error(
              `Telegram push failed: HTTP ${response.status}`
            );
          }

          console.log("Telegram push successful");
          NODE
